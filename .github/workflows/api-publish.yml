name: Publish API docker image to GitHub Container Registry
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (e.g., 1.0.0)"
        required: true
        type: string
      commit_sha:
        description: "Commit SHA to checkout (optional, defaults to the branch head)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
permissions:
  contents: read
jobs:
  upload:
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/liammorrow/liftlog:api
            ghcr.io/liammorrow/liftlog:api-${{ inputs.version_code }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
