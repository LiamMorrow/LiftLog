name: Discussion Welcome Comment

on:
  discussion:
    types: [created]

permissions:
  discussions: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new discussion
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Thanks for starting a discussion! This is an automated message on all new discussions.

            If you have used an LLM to write this, please rewrite in your own words. AI-generated summaries tend to be more verbose than necessary.

            A few things that help reduce the burden on the maintainer:

            - Write in your own words, describing the problem or idea clearly.
            - Write in your original language. If you're not comfortable in English, write in your own language and it can be translated if needed.
            - Search existing [discussions](https://github.com/LiamMorrow/LiftLog/discussions) to check this hasn't already been raised.

            See the [Contributing guide](https://github.com/LiamMorrow/LiftLog/blob/main/CONTRIBUTING.md) for more.`;
            await github.graphql(`
              mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                  comment { id }
                }
              }`,
              { discussionId: context.payload.discussion.node_id, body });
